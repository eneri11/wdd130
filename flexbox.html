<html>

<head>
    <style>
        .container {
            display: flex;
            background-color: dodgerblue;
        }

        .container div {
            background-color: #f1f1f1;
            margin: 10px;
            padding: 20px;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div>

    <p>Flexbox must have a parent element with the display
        property set to flex or inline-flex.</p>
    <p>Direct child elements of the flex container
        automatically becomes flex items.</p>

</body>

</html>
