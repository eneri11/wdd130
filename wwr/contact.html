<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- IMPORTANT: Updated Title + Description -->
    <title>Contact Us - Exciting Expeditions Rafting</title>
    <meta name="description"
      content="Get in touch with Exciting Expeditions for rafting reservations, inquiries, or feedback. Contact our team and plan your next adventure today!">
    <meta name="author" content="Irene Costales">

    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>

    <header>
        <img src="images/z-wwr-blue.jpg" alt="Exciting Expeditions Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- COMPANY INFO -->
        <section class="contact-info">
            <h1>Contact Us</h1>

            <p><strong>Address:</strong> 123 River Rapids Rd, Adventure City</p>
            <p><strong>Phone:</strong> +1 800 555 1234</p>
            <p><strong>Email:</strong> info@excitingexpeditions.com</p>

            <!-- Google Map (NO inline style) -->
            <iframe src="https://www.google.com/maps?q=Grand+Canyon&output=embed" allowfullscreen=""
              loading="lazy">
            </iframe>
        </section>

        <!-- EMPLOYEES -->
        <section class="employees">
            <h2>Meet Our Team</h2>

            <div class="employee-gallery">
                <figure>
                    <img src="images/prof pic4.png" alt="Guide">
                    <figcaption>John Rivera - Lead Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/prof pic3.png" alt="Manager">
                    <figcaption>Sarah Lee - Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/prof pic2.png" alt="Support">
                    <figcaption>Mike Santos - Customer Support</figcaption>
                </figure>
            </div>
        </section>

        <!-- CONTACT FORM -->
        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form action="#" method="post">

                <!-- Name -->
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <!-- Email -->
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <!-- Purpose (RADIO BUTTONS) -->
                <fieldset>
                    <legend>Purpose of Message:</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <!-- Message -->
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <!-- Checkbox -->
                <label class="checkbox">
                    <input type="checkbox" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <!-- Submit -->
                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <footer>
        <p>©️2026 Exciting Expedition | Irene Costales</p>

        <div class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="images/linkedIn.png" alt="LinkedIn"></a>
            <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
        </div>
    </footer>

</body>

</html>
